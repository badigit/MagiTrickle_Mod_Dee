name: Build and Package OPKG

on:
  push:
    branches-ignore:
      - 'refs/tags/*'
      - release
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  release:
    types: [published]

jobs:
  build_frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.JS
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build frontend
        run: |
          make clear
          make build_frontend

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: ./src/frontend/dist
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: build_frontend
    strategy:
      matrix:
        include:
          - config: config/entware/mipsel-3.4_kn.config
            target: mipsel-3.4_kn
          - config: config/entware/aarch64-3.10_kn.config
            target: aarch64-3.10_kn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: src/backend/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot upx

      - name: Download frontend artifacts
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: ./src/frontend/dist

      - name: Build and Package
        run: |
          printf '%s\n' \
            'build_frontend:' \
            $'\tmkdir -p "$(USRSHARE_DIR)/magitrickle/skins/default"' \
            $'\tcp -r ./src/frontend/dist/* "$(USRSHARE_DIR)/magitrickle/skins/default"' \
            > .ci-frontend.mk
          . "${{ matrix.config }}"
          cp "${{ matrix.config }}" .config
          make -f Makefile -f .ci-frontend.mk build package

      - name: List built packages
        if: always()
        run: find ./.build -name "*.ipk" -ls 2>/dev/null || echo "No .ipk files found"

      - name: Prepare artifact
        if: ${{ github.event_name != 'release' }}
        run: |
          mkdir -p ./artifact
          cp ./.build/*_${{ matrix.target }}.ipk ./artifact/

      - name: Upload package
        if: ${{ github.event_name != 'release' }}
        uses: actions/upload-artifact@v5
        with:
          name: magitrickle_${{ matrix.target }}
          path: ./artifact/
          if-no-files-found: error
          compression-level: 0

      - name: Upload asset to release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./.build/magitrickle_*.ipk
          token: ${{ secrets.RELEASE_TOKEN }}
