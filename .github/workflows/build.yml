name: Build and Package OPKG

on:
  push:
    branches-ignore:
      - 'refs/tags/*'
      - release
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  release:
    types: [published]

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.collect.outputs.configs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build config matrix
        id: collect
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          configs = sorted(Path("config").glob("*/*.config"))
          if not configs:
              raise SystemExit("No build configs found")

          matrix = []
          for config in configs:
              platform = config.parent.name
              target = config.stem
              matrix.append({
                  "config": config.as_posix(),
                  "platform": platform,
                  "target": target,
                  "name": f"{platform}_{target}",
              })

          print(f"configs={json.dumps(matrix, separators=(',', ':'))}")
          PY

  build_frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.JS
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build frontend
        run: |
          make clear
          make build_frontend

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: ./src/frontend/dist
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [prepare, build_frontend]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.configs) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: src/backend/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot upx

      - name: Download frontend artifacts
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: ./src/frontend/dist

      - name: Build and Package
        run: |
          printf '%s\n' \
            'build_frontend:' \
            $'\tmkdir -p "$(USRSHARE_DIR)/magitrickle/skins/default"' \
            $'\tcp -r ./src/frontend/dist/* "$(USRSHARE_DIR)/magitrickle/skins/default"' \
            > .ci-frontend.mk
          . "${{ matrix.config }}"
          cp "${{ matrix.config }}" .config
          make -f Makefile -f .ci-frontend.mk build package

      - name: List built packages
        if: always()
        run: find ./.build -name "*.ipk" -ls 2>/dev/null || echo "No .ipk files found"

      - name: Prepare artifact
        if: ${{ github.event_name != 'release' }}
        run: |
          mkdir -p ./artifact
          cp ./.build/*.ipk ./artifact/

      - name: Upload package
        if: ${{ github.event_name != 'release' }}
        uses: actions/upload-artifact@v5
        with:
          name: magitrickle_${{ matrix.name }}
          path: ./artifact/
          if-no-files-found: error
          compression-level: 0

      - name: Upload asset to release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./.build/magitrickle_*.ipk
          token: ${{ secrets.RELEASE_TOKEN }}
