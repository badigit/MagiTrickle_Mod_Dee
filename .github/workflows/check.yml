name: Checking

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/check.yml'

jobs:
  check:
    name: Finding suspicious constructs for ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: mipsle
            gomips: softfloat
          # - goos: linux
          #   goarch: mips
          #   gomips: softfloat
          - goos: linux
            goarch: arm64
          # - goos: linux
          #   goarch: arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: src/backend/go.sum

      - name: Finding suspicious constructs
        working-directory: ./src/backend
        run: |
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" GOMIPS="${{ matrix.gomips }}" GOARM="${{ matrix.goarm }}" go vet ./...

  test_backend:
    name: Backend testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: src/backend/go.sum

      - name: Backend tests
        working-directory: ./src/backend
        run: |
          GOOS=linux go test -tags testing ./...

  test_frontend:
    name: Frontend testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.JS
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install frontend dependencies
        working-directory: ./src/frontend
        run: npm install

      - name: Install Playwright browsers
        working-directory: ./src/frontend
        run: npx playwright install --with-deps

      - name: Frontend unit tests
        working-directory: ./src/frontend
        run: npm run test:unit

      - name: Frontend e2e tests
        working-directory: ./src/frontend
        run: npm run test:e2e
