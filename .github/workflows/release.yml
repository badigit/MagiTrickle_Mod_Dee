name: Release

# Запуск ТОЛЬКО вручную: кнопка Run workflow в Actions или
#   gh workflow run release.yml --ref mod_badigit
# Каждый запуск сам считает следующую версию (последний тег *-badigit.* + 1),
# создаёт тег и релиз с текстом из RELEASE_NOTES.md — поэтому два запуска
# подряд дадут два релиза. Ветка release больше не используется и удалена.
on:
  workflow_dispatch:

jobs:
  create_release:
    name: Create release from tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          LATEST=$(git tag -l '*-badigit.*' --sort=-v:refname | head -1)
          echo "Latest badigit tag: ${LATEST:-none}"

          if [ -z "$LATEST" ]; then
            UPSTREAM=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vE 'badigit' | head -1)
            NEXT="${UPSTREAM:-0.5.2}-badigit.2"
          else
            # e.g. 0.5.2-badigit.3 → base=0.5.2-badigit num=3
            NUM="${LATEST##*-badigit.}"
            BASE="${LATEST%-badigit.*}-badigit"
            NEXT="${BASE}.$(( NUM + 1 ))"
          fi

          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${NEXT}"

      - name: Create tag and push
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Generate changelog
        id: changelog
        run: |
          if [ -s RELEASE_NOTES.md ]; then
            echo "Using RELEASE_NOTES.md from repo"
            cp RELEASE_NOTES.md /tmp/changelog.md
          else
            echo "RELEASE_NOTES.md is absent or empty — generating from git log"
            PREV=$(git tag -l '*-badigit.*' --sort=-v:refname | sed -n '2p')
            if [ -n "$PREV" ]; then
              RANGE="${PREV}..HEAD"
            else
              RANGE="HEAD~30..HEAD"
            fi

            {
              echo "## Что нового"
              echo ""
              git log "$RANGE" --pretty=format:"- %s" --no-merges
              echo ""
              echo ""
              echo "---"
              echo "Установка / обновление:"
              echo '```sh'
              echo 'opkg update && opkg install wget-ssl ca-certificates'
              echo 'wget -qO- https://raw.githubusercontent.com/${{ github.repository }}/mod_badigit/scripts/install.sh | sh'
              echo '```'
            } > /tmp/changelog.md
          fi
          cat /tmp/changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: /tmp/changelog.md
          token: ${{ secrets.RELEASE_TOKEN }}
