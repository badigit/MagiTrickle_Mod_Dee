# Минимальный конфиг mihomo для MagiTrickle (режим redir-tproxy)
# Весь трафик направляется через upstream-сервер без правил маршрутизации.
#
# Важно: используйте redir-port, а НЕ tproxy-port.
# MagiTrickle для TCP применяет nat/REDIRECT, для UDP — mangle/TPROXY.
# redir-port в mihomo корректно обрабатывает оба типа на одном порту.

redir-port: 5001
mode: global
allow-lan: true
log-level: warning
ipv6: false

dns:
  enable: true
  listen: 0.0.0.0:6868
  ipv6: false
  enhanced-mode: redir-host
  nameserver:
    - 8.8.8.8
    - 8.8.4.4

proxy-providers:
  my-subscription:
    type: http
    url: "https://example.com/your-subscription-link"
    interval: 3600
    path: ./proxy_providers/my-sub.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: GLOBAL
    type: select
    use:
      - my-subscription
