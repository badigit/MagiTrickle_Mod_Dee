configVersion: 0.1.4
app:
  httpWeb:
    enabled: true
    auth:
      enabled: false
    host:
      address: "[::]"
      port: 8080
    skin: default
  dnsProxy:
    host:
      address: "[::]"
      port: 3553
    upstream:
      address: 127.0.0.1
      port: 53
    disableRemap53: false
    disableFakePTR: false
    disableDropAAAA: false
    maxIdleConns: 10
    maxConcurrent: 100
    timeout: 5000
    clientTTLCap: 300
    persistCache: false
  clientRouting:
    mode: exclude
    sourceNetworks: []
  netfilter:
    iptables:
      chainPrefix: MT_
    ipset:
      tablePrefix: mt_
      additionalTTL: 86400
    disableIPv4: false
    disableIPv6: false
    startMarkTableIndex: 1298229097
    # Приоритет direct-групп при пересечении по IP:
    #   absolute - direct перебивает все группы, где бы он ни стоял в списке
    #   byOrder  - direct в общей очереди, выигрывает группа выше по списку
    # Смена требует перезапуска демона.
    directPriority: absolute
  link:
    - br0
  showAllInterfaces: false
  logLevel: info
groups:
  - id: d663876a
    name: Example
    interface: nwg0
    enable: false
    rules:
      - id: 6f34ee91
        name: Wildcard Example
        type: wildcard
        rule: '*wildcard.example.com'
        enable: true
      - id: 00ae5f7c
        name: RegEx Example
        type: regex
        rule: '^.*.regex.example.com$'
        enable: true
      - id: 6120dc8a
        name: Domain Example
        type: domain
        rule: 'domain.example.com'
        enable: true
      - id: b9751782
        name: Namespace Example
        type: namespace
        rule: 'namespace.example.com'
        enable: true
